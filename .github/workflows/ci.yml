name: ArtistrySynk CI

on:
  push:
    branches:
      - main
      - feat/competition-platform-foundation
      - feat/creative-talent-hunt-source-port
  pull_request:
    branches:
      - main

jobs:
  quality:
    name: Talent Hunt Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Lint competition domain and tests
        run: npx eslint src/domain/competition.ts src/features/competitions/creativeTalentHunt.ts src/test/competition/creative-talent-hunt.test.ts

      - name: Test competition platform
        run: npm test -- src/test/competition/creative-talent-hunt.test.ts

      - name: Production build
        run: npm run build
