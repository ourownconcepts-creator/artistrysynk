name: ArtistrySynk CI

on:
  push:
    branches:
      - main
      - feat/competition-platform-foundation
      - feat/creative-talent-hunt-source-port
  pull_request:
    branches:
      - main

jobs:
  quality:
    name: Talent Hunt Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Lint changed TypeScript files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.ts' '*.tsx' | grep -v '^src/routeTree.gen.ts$' || true)
          if ((${#files[@]})); then
            printf 'Linting %s changed TypeScript files\n' "${#files[@]}"
            npx eslint "${files[@]}"
          else
            echo "No changed TypeScript files to lint."
          fi

      - name: Test competition platform
        run: npm test -- src/test/competition/creative-talent-hunt.test.ts

      - name: Production build
        run: npm run build
